# Local development stack. Build a dev image and run it with the same
# configuration the container will use in production (env-driven).
#
#   cp .env.example .env
#   docker compose up --build
#
# The Compose Specification no longer needs a top-level `version:` key.
services:
  app:
    build:
      context: .
      args:
        # Overridable: `BUILD_SHA=$(git rev-parse --short HEAD) docker compose build`
        BUILD_SHA: ${BUILD_SHA:-dev}
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
