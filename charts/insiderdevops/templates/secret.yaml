apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insiderdevops.fullname" . }}
  labels:
    {{- include "insiderdevops.labels" . | nindent 4 }}
type: Opaque
# PLACEHOLDER ONLY. The values under `secret:` in values*.yaml are dummy
# defaults so the chart renders and the Deployment can mount them. Do NOT
# commit real secrets here. In production, override via
# `--set secret.API_TOKEN=...` from CI, or replace this template with a
# sealed-secrets / external-secrets managed Secret.
#
# `data:` requires base64; the `b64enc` template function encodes each value
# at render time so plaintext never lands in the rendered manifest's data.
data:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
