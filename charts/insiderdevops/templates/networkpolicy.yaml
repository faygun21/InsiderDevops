{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insiderdevops.fullname" . }}
  labels:
    {{- include "insiderdevops.labels" . | nindent 4 }}
spec:
  # Apply this policy to THIS release's pods only.
  podSelector:
    matchLabels:
      {{- include "insiderdevops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound ONLY from the ingress-nginx controller pods. Because this
    # is the single ingress rule, every other source is implicitly denied.
    # namespaceSelector: {} widens the match to all namespaces (minikube runs
    # the ingress controller in its own `ingress-nginx` namespace), while the
    # podSelector still requires the configured label — the two are AND-ed
    # within one `from` element.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerSelector | nindent 14 }}
  egress:
    # Allow all egress (keep it simple) — DNS, upstream calls, etc.
    - {}
{{- end }}
